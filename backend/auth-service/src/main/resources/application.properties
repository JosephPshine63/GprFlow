spring.application.name=auth-service

server.port=${SERVER_PORT:5458}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gprflow?currentSchema=auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# JWT secret — must match the gateway's and match what it was before the split
jwt.secret=${JWT_SECRET:wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# Frontend base URL for OAuth2 redirect callbacks
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your email}
spring.mail.password=${MAIL_PASSWORD:your app password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# google oauth2 (optional)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your secret}

# user-service base URL — auth-service owns credentials only; fullName and the
# initial (empty) watchlist live in user-service, created/fetched synchronously
# over REST at signup/login (Fase 7/8).
user.service.url=${USER_SERVICE_URL:http://user-service:5459}

# Seed admin account, created on first startup if no user with this email exists yet
admin.seed.email=${ADMIN_EMAIL:admin@gprflow.trade}
admin.seed.password=${ADMIN_PASSWORD:changeme}
admin.seed.full-name=${ADMIN_FULL_NAME:GprFlow Admin}
