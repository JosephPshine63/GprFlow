spring.application.name=ledger-service

server.port=${SERVER_PORT:5457}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gprflow?currentSchema=ledger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# Frontend base URL for payment callbacks
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

#stripe payment gatway
stripe.api.key=${STRIPE_API_KEY:your key}

#razorpay payment gaytway
razorpay.api.key=${RAZORPAY_API_KEY:your razorpay key}
razorpay.api.secret=${RAZORPAY_API_SECRET:your razorpay secret}

# coin-service base URL, used to enrich order/asset responses with live coin data
coin.service.url=${COIN_SERVICE_URL:http://coin-service:5455}
