spring.application.name=user-service

server.port=${SERVER_PORT:5459}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gprflow?currentSchema=users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# coin-service base URL, used by Watchlist to enrich responses with live coin data
coin.service.url=${COIN_SERVICE_URL:http://coin-service:5455}
