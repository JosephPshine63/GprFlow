server:
  port: ${SERVER_PORT:8080}

jwt:
  # Must match the monolith's JWT_SECRET — this is the first time the gateway itself
  # parses a JWT (JwtAuthGlobalFilter), previously it was a pure proxy.
  secret: ${JWT_SECRET:wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:4200"
              - "https://gprflow.trade"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: coin-service
          uri: ${COIN_SERVICE_URL:http://coin-service:5455}
          predicates:
            - Path=/api/coins/**
        - id: chatbot-service
          uri: ${CHATBOT_SERVICE_URL:http://chatbot-service:5456}
          predicates:
            - Path=/chat/**
        - id: ledger-service
          uri: ${LEDGER_SERVICE_URL:http://ledger-service:5457}
          predicates:
            - Path=/api/wallet/**,/api/orders/**,/api/payment/**,/api/withdrawal/**,/api/admin/withdrawal/**,/api/assets/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:5458}
          predicates:
            - Path=/auth/**,/login/oauth2/**,/api/users/profile,/api/users/enable-two-factor/**,/api/users/verification/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:5459}
          predicates:
            - Path=/api/users/{id},/api/users/email/{email},/api/watchlist/**,/api/payment-details
        - id: monolith
          uri: ${MONOLITH_URL:http://app:5454}
          predicates:
            - Path=/**
