# app.* is the same container as the public site; only gprflow.trade may be indexed
map $host $robots_tag {
    default "";
    app.gprflow.trade "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;

    # written at container start from API_BASE_URL; a cached copy points the app at the wrong API
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # indexable landing pages, generated per language by scripts/seo-build.mjs;
    # they must not add_header here or the server-level headers above stop applying
    location = / {
        try_files /landing/en.html /index.html;
    }

    location ~ ^/(it|fr|de|es)/?$ {
        try_files /landing/$1.html /index.html;
    }

    # a missing file is a 404, not the SPA shell (robots.txt, sitemap.xml, stale hashed assets)
    location ~* \.(js|css|map|png|jpe?g|webp|svg|ico|json|xml|txt|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
