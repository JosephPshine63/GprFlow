services:
  db:
    image: postgres:15
    container_name: gprflow-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-gprflow}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-gprflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend/monolith
    container_name: gprflow-app
    restart: always
    # Kept published on 5454 for direct debug access. Auth/User/Verification/
    # Watchlist/PaymentDetails all live in auth-service/user-service now (Fase 7-8);
    # HomeController is the only thing left here, no DB needed.
    ports:
      - "5454:5454"

  coin-service:
    build:
      context: ./backend/coin-service
    container_name: gprflow-coin-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=coin
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-your coin gecko api key}
    # No published port: reachable only via the gateway or the internal
    # Compose network (CoinClient in the monolith calls it by DNS name).

  chatbot-service:
    build:
      context: ./backend/chatbot-service
    container_name: gprflow-chatbot-service
    restart: always
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your gemini api key}
    # No published port: reachable only via the gateway.

  ledger-service:
    build:
      context: ./backend/ledger-service
    container_name: gprflow-ledger-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=ledger
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # No JWT_SECRET: ledger-service never parses a JWT, it trusts the gateway's headers.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-your key}
      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY:-your razorpay key}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET:-your razorpay secret}
      COIN_SERVICE_URL: http://coin-service:5455
    # No published port: reachable only via the gateway.

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: gprflow-auth-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=auth
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MAIL_USERNAME: ${MAIL_USERNAME:-your email}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your app password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your secret}
      USER_SERVICE_URL: http://user-service:5459
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gprflow.trade}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-first-boot}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-GprFlow Admin}
    # No published port: reachable only via the gateway.

  user-service:
    build:
      context: ./backend/user-service
    container_name: gprflow-user-service
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # No JWT_SECRET: user-service never parses a JWT, it trusts the gateway's headers.
      COIN_SERVICE_URL: http://coin-service:5455
    # No published port: reachable only via the gateway.

  gateway:
    build:
      context: ./backend/gateway
    container_name: gprflow-gateway
    restart: always
    depends_on:
      - app
      - coin-service
      - chatbot-service
      - ledger-service
      - auth-service
      - user-service
    environment:
      MONOLITH_URL: http://app:5454
      COIN_SERVICE_URL: http://coin-service:5455
      CHATBOT_SERVICE_URL: http://chatbot-service:5456
      LEDGER_SERVICE_URL: http://ledger-service:5457
      AUTH_SERVICE_URL: http://auth-service:5458
      USER_SERVICE_URL: http://user-service:5459
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
    ports:
      - "8087:8080"

  frontend:
    build:
      context: ./frontend
    container_name: gprflow-frontend
    restart: always
    depends_on:
      - gateway
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"

volumes:
  postgres-data:
