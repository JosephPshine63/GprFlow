# unrotated json logs eventually fill the disk and take the whole stack down
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# TCP probe on the service port: the temurin JRE image has bash but no curl, and
# no service ships actuator. Tomcat/Netty bind the port only once the context is up.
x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 90s

services:
  db:
    image: postgres:15
    container_name: gprflow-postgres
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-gprflow}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # 5432/5433/5434 are already taken by other stacks on the host; publish on
    # 5441 for direct debug access (psql, DBeaver) without colliding with them.
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-gprflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend/monolith
    container_name: gprflow-app
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5454"]
    # Kept published on 5454 for direct debug access. Auth/User/Verification/
    # Watchlist/PaymentDetails all live in auth-service/user-service now (Fase 7-8);
    # HomeController is the only thing left here, no DB needed.
    ports:
      - "5454:5454"

  coin-service:
    build:
      context: ./backend/coin-service
    container_name: gprflow-coin-service
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5455"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=coin
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-your coin gecko api key}
    # No published port: reachable only via the gateway or the internal
    # Compose network (CoinClient in the monolith calls it by DNS name).

  chatbot-service:
    build:
      context: ./backend/chatbot-service
    container_name: gprflow-chatbot-service
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5456"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your gemini api key}
    # No published port: reachable only via the gateway.

  ledger-service:
    build:
      context: ./backend/ledger-service
    container_name: gprflow-ledger-service
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5457"]
    depends_on:
      db:
        condition: service_healthy
      coin-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=ledger
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # No JWT_SECRET: ledger-service never parses a JWT, it trusts the gateway's headers.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-your key}
      COIN_SERVICE_URL: http://coin-service:5455
    # No published port: reachable only via the gateway.

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: gprflow-auth-service
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5458"]
    depends_on:
      db:
        condition: service_healthy
      # the admin seed creates its profile in user-service on first boot and is not retried
      user-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=auth
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RESEND_API_KEY: ${RESEND_API_KEY:-your resend api key}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-GprFlow <noreply@gprflow.trade>}
      USER_SERVICE_URL: http://user-service:5459
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gprflow.trade}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-first-boot}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-GprFlow Admin}
    # No published port: reachable only via the gateway.

  user-service:
    build:
      context: ./backend/user-service
    container_name: gprflow-user-service
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5459"]
    depends_on:
      db:
        condition: service_healthy
      coin-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-gprflow}?currentSchema=users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # No JWT_SECRET: user-service never parses a JWT, it trusts the gateway's headers.
      COIN_SERVICE_URL: http://coin-service:5455
    # No published port: reachable only via the gateway.

  gateway:
    build:
      context: ./backend/gateway
    container_name: gprflow-gateway
    restart: always
    logging: *logging
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
    depends_on:
      app:
        condition: service_healthy
      coin-service:
        condition: service_healthy
      chatbot-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      MONOLITH_URL: http://app:5454
      COIN_SERVICE_URL: http://coin-service:5455
      CHATBOT_SERVICE_URL: http://chatbot-service:5456
      LEDGER_SERVICE_URL: http://ledger-service:5457
      AUTH_SERVICE_URL: http://auth-service:5458
      USER_SERVICE_URL: http://user-service:5459
      JWT_SECRET: ${JWT_SECRET:-wpembytrwcvnryxksdbqwjebruyGHyudqgwveytrtrCSnwifoesarjbwe}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    ports:
      - "8087:8080"

  frontend:
    build:
      context: ./frontend
    container_name: gprflow-frontend
    restart: always
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8087}
      # the public site is a demo and its copy promises Stripe test cards
      STRIPE_TEST_MODE: ${STRIPE_TEST_MODE:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      # true only once Resend is configured: the OTP flows are hidden otherwise
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    ports:
      - "5173:80"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: gprflow-cloudflared
    restart: always
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # Open the tunnel only once the origin answers, so Cloudflare never routes to a
    # half-started stack. No healthcheck of its own: the image is distroless, and
    # cloudflared reconnects by itself or exits (and gets restarted) on fatal errors.
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    # No published ports: outbound-only connection to Cloudflare's edge.
    # Ingress rules (app.gprflow.trade -> frontend:80, api.gprflow.trade -> gateway:8080)
    # are configured on the tunnel itself via the Cloudflare dashboard/CLI, not here.

volumes:
  postgres-data:
